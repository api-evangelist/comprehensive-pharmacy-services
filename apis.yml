name: Comprehensive Pharmacy Services
description: 'Comprehensive Pharmacy Services, now operating as CPS Solutions, LLC, is a
  healthcare company with more than 50 years of experience providing pharmacy and hospital
  solutions across the care continuum. It serves independent hospitals, health systems,
  integrated delivery networks (IDNs), and specialized health facilities with specialty
  pharmacy, pharmacy management, telepharmacy (24/7/365 support), 340B program compliance,
  supply chain management, rehabilitation services, and consulting. The company operates
  two proprietary SaaS platforms — CPS Optimizer for pharmacy management and TherigySTM
  for specialty pharmacy management — supported by 2,500+ healthcare professionals serving
  800+ customers across the United States and Puerto Rico. No public API or developer
  program is currently published; this profile captures the company identity and public
  web surface.'
